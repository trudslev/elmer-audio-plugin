<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,600;125,700&family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Share+Tech+Mono&family=Archivo+Black&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #6f6d63; }
  a { color: #4a3f22; }
  a:hover { color: #2a2312; }
</style>
</helmet>
<div style="padding:40px;background:#6f6d63;">
<div style="position:relative;margin:0 auto;width:1340px;height:660px;background:linear-gradient(180deg,#b3ac9d,#aca596);box-shadow:0 10px 40px rgba(0,0,0,.35);overflow:hidden;">

  <div style="position:absolute;left:16px;top:16px;width:1308px;height:104px;box-sizing:border-box;border-radius:5px;background:linear-gradient(180deg,#b6afa0,#ada697);box-shadow:inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.10), 0 3px 5px rgba(0,0,0,.14), 0 1px 0 rgba(255,255,255,.35);">
    <div style="position:absolute;left:22px;top:14px;width:303px;height:84px;">
      <div style="font-family:'Archivo','Archivo Black',sans-serif;font-weight:700;font-stretch:125%;font-size:31px;line-height:34px;letter-spacing:.10em;color:#26221a;margin-top:2px;text-shadow:0 -1px 0 rgba(0,0,0,.42), 0 -1.5px 1.5px rgba(0,0,0,.24), 0 1px 0 rgba(255,255,255,.55), 0 1.5px 1.5px rgba(255,255,255,.22);">ELMER</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;line-height:17px;letter-spacing:.26em;color:#0e0d08;margin-top:12px;">BUS COMPRESSOR</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;line-height:14px;letter-spacing:.20em;color:#0f0f0c;">MODEL GL-87 · STEREO</div>
    </div>
    <div style="position:absolute;left:341px;top:25px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;line-height:13px;letter-spacing:.24em;color:#0e0d08;">{{ caption }}</div>
    <div style="position:absolute;left:341px;top:45px;width:641px;height:34px;box-sizing:border-box;display:flex;align-items:stretch;background:linear-gradient(180deg,#1b1a16,#242219);box-shadow:inset 0 0 0 1px #6c665a, inset 0 2px 6px rgba(0,0,0,.7);border-radius:3px;overflow:hidden;">
      <div style="width:72px;display:flex;align-items:center;justify-content:center;border-right:1px solid #46402f;font-family:'Share Tech Mono',monospace;font-size:17px;line-height:22px;letter-spacing:.10em;color:#e6dcae;">{{ bankTag }}</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:17px;line-height:22px;letter-spacing:.10em;color:#e6dcae;text-shadow:0 0 8px rgba(214,196,124,.45);">{{ programName }}</div>
      <div style="width:30px;box-sizing:border-box;display:flex;align-items:center;justify-content:flex-end;padding-right:16px;"><svg viewBox="0 0 14 8" style="width:14px;height:8px;flex:0 0 14px;"><path d="M1 1.6 L7 6.4 L13 1.6" fill="none" stroke="#e6dcae" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
    </div>
    <div style="position:absolute;left:990px;top:45px;width:62px;height:34px;box-sizing:border-box;border-radius:4px;background:linear-gradient(180deg,#23282c,#14181b);box-shadow:inset 0 0 0 1px #0b0d0f, inset 0 1px 0 rgba(255,255,255,.10), inset 0 -2px 5px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;line-height:13px;letter-spacing:.12em;color:{{ saveInk }};text-shadow:{{ saveGlow }};">SAVE</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;line-height:13px;letter-spacing:.12em;color:{{ storeInk }};text-shadow:{{ storeGlow }};">STORE</span>
    </div>
    <div style="position:absolute;left:1060px;top:45px;width:70px;height:34px;box-sizing:border-box;border-radius:4px;background:linear-gradient(180deg,#23282c,#14181b);box-shadow:inset 0 0 0 1px #0b0d0f, inset 0 1px 0 rgba(255,255,255,.10), inset 0 -2px 5px rgba(0,0,0,.55), 0 1px 2px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;line-height:13px;letter-spacing:.12em;color:{{ deleteInk }};text-shadow:{{ deleteGlow }};">DELETE</span>
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;line-height:13px;letter-spacing:.12em;color:{{ cancelInk }};text-shadow:{{ cancelGlow }};">CANCEL</span>
    </div>
    <div style="position:absolute;left:1148px;top:25px;width:64px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;line-height:13px;letter-spacing:.28em;color:#0e0d08;">IN</div>
    <div style="position:absolute;left:1148px;top:45px;width:64px;height:34px;box-sizing:border-box;background:linear-gradient(180deg,#1b1a16,#242219);box-shadow:inset 0 0 0 1px #6c665a, inset 0 2px 6px rgba(0,0,0,.7);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:17px;line-height:22px;color:#e6dcae;">−8.4</div>
    <div style="position:absolute;left:1222px;top:25px;width:64px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;line-height:13px;letter-spacing:.28em;color:#0e0d08;">OUT</div>
    <div style="position:absolute;left:1222px;top:45px;width:64px;height:34px;box-sizing:border-box;background:linear-gradient(180deg,#1b1a16,#242219);box-shadow:inset 0 0 0 1px #6c665a, inset 0 2px 6px rgba(0,0,0,.7);border-radius:3px;display:flex;align-items:center;justify-content:center;font-family:'Share Tech Mono',monospace;font-size:17px;line-height:22px;color:#e6dcae;">−6.1</div>
  </div>

  <div style="position:absolute;left:500px;top:136px;width:1px;height:244px;background:rgba(255,255,255,.5);"></div>
  <div style="position:absolute;left:16px;top:386px;width:1308px;height:1px;background:rgba(255,255,255,.5);"></div>
  <div style="position:absolute;left:700px;top:396px;width:1px;height:248px;background:rgba(255,255,255,.5);"></div>

  <div style="position:absolute;left:510px;top:150px;width:804px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;line-height:15px;letter-spacing:.28em;color:#0e0d08;">DETECTOR</div>
  <div style="position:absolute;left:26px;top:412px;width:664px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;line-height:15px;letter-spacing:.28em;color:#0e0d08;">TIMING</div>
  <div style="position:absolute;left:710px;top:412px;width:604px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;line-height:15px;letter-spacing:.28em;color:#0e0d08;">OUTPUT</div>

  <div style="position:absolute;left:60px;top:150px;width:396px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;line-height:14px;letter-spacing:.14em;color:#0e0d08;">GAIN REDUCTION METER</div>
  <div style="position:absolute;left:60px;top:176px;width:396px;height:159px;border-radius:4px;overflow:hidden;box-shadow:0 4px 12px rgba(35,30,22,.45), 0 1px 0 rgba(255,255,255,.34);">
    <img src="assets/elmer/meter-face.png" width="396" height="159.2" style="position:absolute;left:0;top:0;" />
    <div style="position:absolute;left:198px;top:198px;width:0;height:0;transform:rotate({{ needleDeg }}deg);">
      <img src="assets/elmer/meter-needle.png" width="23.8" height="202.3" style="position:absolute;left:-11.9px;top:-197.6px;" />
    </div>

    <div style="position:absolute;left:0;top:0;width:396px;height:159px;background:linear-gradient(118deg,rgba(255,255,255,.10) 0 22%,rgba(255,255,255,0) 40%);"></div>
  </div>
  <div style="position:absolute;left:60px;top:342px;width:396px;text-align:center;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;line-height:14px;letter-spacing:.14em;color:#2d2b24;">STEREO LINKED · ONE DETECTOR</div>

  <sc-for list="{{ knobs }}" as="k" hint-placeholder-count="8">
    <div style="position:absolute;left:{{ k.left }}px;top:{{ k.top }}px;width:{{ k.d }}px;height:{{ k.d }}px;">
      <div style="position:absolute;left:50%;top:50%;width:{{ k.arcBox }}px;height:{{ k.arcBox }}px;transform:translate(-50%,-50%) rotate({{ k.arcRotate }}deg);border-radius:50%;background:conic-gradient(from 220deg,rgba(22,21,15,.30) 0turn 0.7778turn,rgba(0,0,0,0) 0.7778turn);mask:radial-gradient(closest-side,rgba(0,0,0,0) calc(100% - 1.4px),#000 calc(100% - 1.4px));"></div>
      <sc-for list="{{ k.ticks }}" as="t" hint-placeholder-count="6">
        <div style="position:absolute;left:50%;bottom:50%;width:{{ t.w }}px;height:{{ t.h }}px;margin-left:-1px;transform-origin:bottom center;transform:rotate({{ t.a }}deg);background:linear-gradient(180deg,#16150f 0 {{ t.ink }}px,rgba(0,0,0,0) {{ t.ink }}px);"></div>
      </sc-for>
      <sc-for list="{{ k.nums }}" as="n" hint-placeholder-count="5">
        <div style="position:absolute;left:50%;top:50%;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:11px;line-height:13px;color:#0e0d08;white-space:nowrap;transform:{{ n.tf }};">{{ n.t }}</div>
      </sc-for>
      <div style="position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 200deg,#e8e3da,#b6afa5 18%,#efeae1 34%,#a8a199 52%,#e6e1d8 70%,#b0a9a0 86%,#e8e3da);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55), inset 0 -2px 4px rgba(0,0,0,.30), 0 3px 7px rgba(0,0,0,.34);"></div>
      <div style="position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 34% 24%,{{ k.capHi }},{{ k.capBase }} 52%,{{ k.capLo }} 100%);box-shadow:inset 0 -7px 12px rgba(0,0,0,.42), inset 0 2px 3px rgba(255,255,255,.22), 0 1px 2px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.35);"></div>
      <div style="position:absolute;inset:6px;border-radius:50%;background:radial-gradient(13% 9% at 32% 18%,rgba(255,255,255,.98) 0 38%,rgba(255,255,255,.50) 64%,rgba(255,255,255,0) 100%),radial-gradient(28% 11% at 58% 87%,rgba(255,255,255,.26),rgba(255,255,255,0) 100%);"></div>
      <div style="position:absolute;left:50%;bottom:50%;width:3px;height:{{ k.pointerH }}px;margin-left:-1.5px;border-radius:1.5px;transform-origin:bottom center;transform:rotate({{ k.ang }}deg);background:#f6f1e6;box-shadow:0 0 2px rgba(0,0,0,.45);"></div>
      <div style="position:absolute;left:50%;top:{{ k.unitTop }}px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10px;line-height:13px;letter-spacing:.10em;color:#0e0d08;white-space:nowrap;">{{ k.unit }}</div>
      <div style="position:absolute;left:50%;top:{{ k.labelTop }}px;transform:translateX(-50%);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;line-height:15px;letter-spacing:.18em;color:#0e0d08;white-space:nowrap;">{{ k.name }}</div>
    </div>
  </sc-for>

  <div style="position:absolute;left:1100px;top:266px;width:180px;display:flex;gap:12px;">
    <div style="flex:1;height:34px;box-sizing:border-box;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:{{ softFace }};box-shadow:{{ softShadow }};">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;line-height:13px;letter-spacing:.14em;color:{{ softInk }};text-shadow:{{ softGlow }};">SOFT</span>
    </div>
    <div style="flex:1;height:34px;box-sizing:border-box;border-radius:3px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:{{ hardFace }};box-shadow:{{ hardShadow }};">
      <span style="font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;line-height:13px;letter-spacing:.14em;color:{{ hardInk }};text-shadow:{{ hardGlow }};">HARD</span>
    </div>
  </div>
  <div style="position:absolute;left:1100px;top:334px;width:180px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;line-height:15px;letter-spacing:.18em;color:#0e0d08;">KNEE</div>
  <div style="position:absolute;left:26px;top:634px;width:400px;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10px;line-height:13px;letter-spacing:.18em;color:#34322a;">GL-87 · SN 0042</div>
  <div style="position:absolute;left:914px;top:634px;width:400px;text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:10px;line-height:13px;letter-spacing:.18em;color:#34322a;">v1.0</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1420,&quot;height&quot;:740},&quot;programState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;factory&quot;,&quot;factory-edited&quot;,&quot;user&quot;,&quot;user-edited&quot;,&quot;naming&quot;],&quot;default&quot;:&quot;factory&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Panel state&quot;},&quot;knee&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;soft&quot;,&quot;hard&quot;],&quot;default&quot;:&quot;soft&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Panel state&quot;},&quot;grDb&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:0,&quot;max&quot;:20,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;dB&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Panel state&quot;}}">
class Component extends DCLogic {
  // Elmer sweeps 280°, start −140°, per BRAND.md's per-casting sweep freedom. Angle = −140 + f × 280.
  a(f) { return -140 + f * 280; }

  knobSpec() {
    const A = (f) => this.a(f);
    // Function-group cap colour, carried forward from Elmer's current panel — the SSL-derived look.
    // Colour is organisation, not information: every legend reads without it, and the one-accent
    // rule governs live-state indicators, which cap colour is not.
    const DET = ['#EE5C9C', '#D5257A', '#8E1152'];
    const TIM = ['#4FC79C', '#17825F', '#0C6247'];
    const OUT = ['#6E9CE8', '#3A6FD0', '#1E4189'];
    // [name, unit, cx, cy, d, pointer fraction, marks[[fraction, numeral, numbered]], group]
    return [
      ['THRESHOLD', 'dB', 618, 262, 76, 0.56, [
        [0, '−40', 1], [0.2, '−30', 0], [0.4, '−20', 1], [0.6, '−10', 0], [0.8, '0', 1], [1, '+10', 1]], DET],
      ['SIDECHAIN HP', 'Hz', 800, 262, 56, 0, [
        [0, 'OFF', 1], [0.2, '40', 0], [0.4, '75', 0], [0.6, '140', 1], [0.8, '265', 0], [1, '500', 1]], DET],
      ['RATIO', '', 982, 262, 76, 0.5, [
        [0, '1.5:1', 1], [0.25, '2:1', 1], [0.5, '4:1', 1], [0.75, '10:1', 1], [1, '20:1', 1]], DET],
      ['ATTACK', 'ms', 253, 524, 56, 0.807388, [
        [0, '0.1', 1], [0.192612, '0.3', 0], [0.403694, '1', 1], [0.596306, '3', 0], [0.807388, '10', 0], [1, '30', 1]], TIM],
      ['RELEASE', '', 453, 524, 76, 0.25, [
        [0, '0.1 s', 1], [0.25, '0.3 s', 1], [0.5, '0.6 s', 1], [0.75, '1.2 s', 1], [1, 'AUTO', 1]], TIM],
      ['IRON', '%', 822, 524, 56, 0.2, [
        [0, '0', 1], [0.25, '25', 0], [0.5, '50', 1], [0.75, '75', 0], [1, '100', 1]], OUT],
      ['MAKEUP', 'dB', 1012, 524, 76, 0, [
        [0, '0', 1], [0.25, '5', 1], [0.5, '10', 1], [0.75, '15', 1], [1, '20', 1]], OUT],
      ['MIX', '%', 1202, 524, 56, 1, [
        [0, '0', 1], [0.25, '25', 0], [0.5, '50', 1], [0.75, '75', 0], [1, '100', 1]], OUT]
    ].map(([name, unit, cx, cy, d, pf, marks, group]) => ({
      name, unit, cx, cy, d, ang: A(pf), group,
      marks: marks.map(([f, t, numbered]) => [A(f), t, numbered])
    }));
  }

  renderVals() {
    const state = this.props.programState ?? 'factory';
    const kneeSoft = (this.props.knee ?? 'soft') === 'soft';

    const lit = { ink: '#f4f8fa', glow: '0 0 7px rgba(244,248,250,.6)' };
    const idle = { ink: '#9aa1a6', glow: 'none' };
    const naming = state === 'naming';
    const edited = state === 'factory-edited' || state === 'user-edited';
    const user = state === 'user' || state === 'user-edited';

    const names = {
      'factory': ['FACT', '01 BUS GLUE 4:1'],
      'factory-edited': ['FACT', '01 BUS GLUE 4:1 *'],
      'user': ['USER', 'DRUM BUS SLOW'],
      'user-edited': ['USER', 'DRUM BUS SLOW *'],
      'naming': ['NAME', 'DRUM BUS SLOW▮']
    };
    const [bankTag, programName] = names[state] || names['factory'];

    const knobs = this.knobSpec().map((k) => {
      const r = k.d / 2;
      const numR = r + 8 + 9 + 6 + 6.5;
      return {
        name: k.name, unit: k.unit, d: k.d, ang: k.ang,
        capHi: k.group[0], capBase: k.group[1], capLo: k.group[2],
        left: k.cx - r, top: k.cy - r,
        arcBox: k.d + 12,
        // The sweep arc is a 280° wedge, so it is rotated 10° off the 270° default's 225° start.
        arcRotate: 0,
        pointerH: r - 7,
        // Registration box: both rows lead with Ø76, so the unit and label are
        // positioned off a 76 box for every class — dy = (76 − d) / 2 = REG − r.
        // Pivots register on the row's Y and labels still land on one line.
        unitTop: k.d + 20 + (38 - r),
        labelTop: k.d + 34 + (38 - r),
        ticks: k.marks.map(([a, , numbered]) => numbered
          ? { a, h: r + 8 + 9, ink: 9, w: 2 }
          : { a, h: r + 8 + 5, ink: 5, w: 1.5 }),
        nums: k.marks.filter(([, t, numbered]) => numbered).map(([a, t]) => ({
          t,
          tf: 'translate(-50%,-50%) rotate(' + a + 'deg) translate(0,-' + numR + 'px) rotate(' + (-a) + 'deg)'
        }))
      };
    });

    // Gain-reduction meter, carried forward from Elmer's current panel: 0 at the right end stop,
    // reduction swinging anticlockwise, needle resting at zero reduction. Its own geometry —
    // pivot at 0.5 x face width below the top edge, +63deg at 0 dB to -63deg at 20 dB.
    const gr = this.props.grDb ?? 5;
    const needleDeg = 63 - (Math.max(0, Math.min(20, gr)) / 20) * 126;

    // KNEE lamp lenses in the DETECTION group's magenta - lit and unlit separated by brightness
    // within that hue, not by a change of hue. A lamp darkens its own face when it lights, so the
    // legend is the bright thing.
    const lensLit = {
      face: 'linear-gradient(180deg,#7a1244,#4d0a2b)',
      shadow: 'inset 0 0 0 1px #2c0618, inset 0 1px 0 rgba(255,255,255,.14), inset 0 -2px 5px rgba(0,0,0,.5), inset 0 0 12px 2px rgba(213,37,122,.45)',
      ink: '#ffe9f3', glow: '0 0 7px rgba(255,233,243,.6)'
    };
    const lensUnlit = {
      face: 'linear-gradient(180deg,#d2b9c6,#b79dab)',
      shadow: 'inset 0 0 0 1px #7d6470, inset 0 1px 0 rgba(255,255,255,.5), 0 1px 2px rgba(0,0,0,.22)',
      ink: '#150a0f', glow: 'none'
    };
    const soft = kneeSoft ? lensLit : lensUnlit;
    const hard = kneeSoft ? lensUnlit : lensLit;

    return {
      caption: naming ? 'NAME PROGRAM' : 'PROGRAM',
      bankTag, programName,
      saveInk: (!naming && edited ? lit : idle).ink, saveGlow: (!naming && edited ? lit : idle).glow,
      storeInk: (naming ? lit : idle).ink, storeGlow: (naming ? lit : idle).glow,
      deleteInk: (!naming && user ? lit : idle).ink, deleteGlow: (!naming && user ? lit : idle).glow,
      cancelInk: (naming ? lit : idle).ink, cancelGlow: (naming ? lit : idle).glow,
      knobs, needleDeg,
      softFace: soft.face, softShadow: soft.shadow, softInk: soft.ink, softGlow: soft.glow,
      hardFace: hard.face, hardShadow: hard.shadow, hardInk: hard.ink, hardGlow: hard.glow
    };
  }
}
</script>
</body>
</html>
